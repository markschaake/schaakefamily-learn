name: implement-tessellations-mini-app
description: Add a touch-first, client-side tessellations mini-app where kids
  select from a curated set of basic shapes (square, equilateral triangle,
  regular hexagon, regular pentagon, circle), drag a shape on a board, see
  tessellation capability feedback, and preview repeating patterns.
  Self-contained under app/tessellations/ with one modification to app/page.tsx
  for the home tile.
base_branch: main
mode: excursion
validate:
  - bun run lint
  - bun run build
plans:
  - id: plan-01-tessellations-app
    name: Implement Tessellations Mini-App
    depends_on: []
    branch: implement-tessellations-mini-app/plan-01-tessellations-app
    build:
      - implement
      - review-cycle
    review:
      strategy: auto
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - review-cycle
  defaultReview:
    strategy: single
    perspectives:
      - code
      - verify
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "This is a single-feature mini-app (new /tessellations route) that
    touches multiple files within one coherent subsystem. A single planner
    session can enumerate all plans, files, and cross-cutting concerns (shared
    shape model, component tree, home page tile) — no expedition split is
    warranted. Plan-review-cycle adds a quality gate before build since
    correctness matters for kid-facing educational content. Build is implement →
    review-cycle for iterative quality. No doc-author/doc-sync: the PRD names no
    new docs, and AGENTS.md conventions already cover the pattern. No test
    stages: per AGENTS.md, tests aren't required for trivial mini-apps. Review
    uses 'single' strategy with 'code' and 'verify' perspectives at standard
    strictness — correctness-sensitive (kids learn from it) but not
    security-sensitive (no auth, no data, static site)."
