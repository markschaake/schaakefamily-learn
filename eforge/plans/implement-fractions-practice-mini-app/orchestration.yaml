name: implement-fractions-practice-mini-app
description: Port the existing standalone fractions-practice app into the
  learn.schaakefamily.com hub as a self-contained /fractions mini-app, with
  /fractions/session running the 10-problem practice flow end-to-end and the
  home tile flipped from coming-soon to ready.
base_branch: main
mode: excursion
validate:
  - bun run lint
  - bun run build
plans:
  - id: plan-01-foundation
    name: "Foundation: domain types, problem set, storage, and session reducer"
    depends_on: []
    branch: implement-fractions-practice-mini-app/plan-01-foundation
    build:
      - implement
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
  - id: plan-02-ui-primitives
    name: "UI primitives: representations, feedback, rule-panel, and chime"
    depends_on:
      - plan-01-foundation
    branch: implement-fractions-practice-mini-app/plan-02-ui-primitives
    build:
      - implement
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
  - id: plan-03-routes-and-session
    name: Routes, session player, question components, and home tile flip
    depends_on:
      - plan-02-ui-primitives
    branch: implement-fractions-practice-mini-app/plan-03-routes-and-session
    build:
      - implement
      - review-cycle
    review:
      strategy: single
      perspectives:
        - code
      maxRounds: 1
      evaluatorStrictness: standard
pipeline:
  scope: excursion
  compile:
    - planner
    - plan-review-cycle
  defaultBuild:
    - implement
    - review-cycle
  defaultReview:
    strategy: single
    perspectives:
      - code
      - verify
    maxRounds: 2
    evaluatorStrictness: standard
  rationale: "The PRD explicitly recommends Excursion and the work fits: a
    cohesive feature port of an existing fractions-practice app into a hub
    mini-app. It touches multiple files (landing page, nested session route,
    ported _lib/_components, home tile update, possible globals.css tweak) but a
    single planner session can enumerate all plans, file changes, and ordering —
    there are no 4+ independent subsystems and no delegated module planning is
    required. Compile uses planner + plan-review-cycle because plan quality
    matters here: the port involves non-trivial styling/dependency adaptation
    (Tailwind v3→v4 token translation, removing lucide/Radix/CVA), nested route
    shape, and acceptance criteria around end-to-end flow — a plan review gate
    catches scope drift before build. Build uses implement followed by
    review-cycle to iteratively catch issues in the ported flow, reducer logic,
    SSR-safe localStorage, and touch-first UI. doc-author/doc-sync are
    intentionally omitted: the project explicitly forbids analytics/auth/APIs
    and the PRD adds no new public APIs or documentation surfaces beyond
    AGENTS-described conventions, so there is nothing meaningful to author or
    sync. test-write/test are omitted because AGENTS.md says not to add tests
    for trivial mini-apps and the PRD scopes validation to bun lint + bun build
    + manual smoke. Review uses single strategy with code and verify
    perspectives — code covers the UI/reducer/storage port and verify confirms
    the acceptance criteria (10-problem flow, three question types,
    retry/reveal, summary, no autoplay, ≥44px targets, no new deps, lint+build
    pass). security/api/docs/test perspectives are not relevant: no auth, no API
    routes, no new docs, no tests. maxRounds=2 with standard strictness balances
    catching real issues against over-iterating on a static kid-app port."
